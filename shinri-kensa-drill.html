<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理検査 暗記ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4EE; --paper-2:#FBFAF6; --ink:#16243F; --ink-soft:#3a4860;
    --muted:#6E6E66; --line:#DCDAD0; --blue:#2E5AA8; --green:#2C7A5E;
    --green-bg:#E5F0EB; --red:#BF3B2B; --red-bg:#F6E6E2;
    --shadow:0 1px 0 rgba(22,36,63,.04), 0 8px 28px -16px rgba(22,36,63,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(rgba(46,90,168,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,90,168,.045) 1px, transparent 1px);
    background-size:26px 26px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{max-width:680px;margin:0 auto;padding:24px 18px 64px}
  .mono{font-family:"Space Mono",monospace}

  .mast{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:26px}
  .mast .eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--blue);margin:0 0 6px}
  .mast h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;
    font-size:clamp(26px,7vw,38px);line-height:1.12;margin:0;letter-spacing:.01em}
  .mast .sub{color:var(--muted);font-size:13px;margin-top:8px}

  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    padding:22px;box-shadow:var(--shadow)}
  .lead{font-size:15px;color:var(--ink-soft);margin:0 0 22px}

  .seclabel{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
  .seclabel .mini{flex:none;display:flex;gap:10px}
  .seclabel .mini button{background:none;border:none;color:var(--blue);cursor:pointer;
    font-family:"Noto Sans JP",sans-serif;font-size:11px;letter-spacing:0;text-transform:none;padding:0}
  .seclabel .mini button:hover{text-decoration:underline}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .chip{font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--paper-2);
    color:var(--ink-soft);border-radius:999px;padding:7px 13px;cursor:pointer;transition:all .15s;
    display:inline-flex;align-items:center;gap:7px}
  .chip .ct{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip[aria-pressed="true"] .ct{color:rgba(255,255,255,.7)}
  .chip:hover{border-color:var(--ink)}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-2)}
  .seg button{border:none;background:transparent;padding:9px 18px;font-size:13px;
    font-family:"Noto Sans JP",sans-serif;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

  .opts-row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:2px 0 24px}
  .toggle{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none}
  .toggle input{position:absolute;opacity:0;width:0;height:0}
  .switch{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .18s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle input:checked + .switch{background:var(--green)}
  .toggle input:checked + .switch::after{transform:translateX(18px)}
  .toggle input:focus-visible + .switch{outline:2px solid var(--blue);outline-offset:2px}

  .btn{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:16px;border:none;border-radius:11px;
    padding:15px 22px;cursor:pointer;transition:transform .1s, filter .15s;display:inline-flex;
    align-items:center;justify-content:center;gap:10px;width:100%}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{filter:brightness(1.12)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn .ar{font-family:"Space Mono",monospace}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .btnrow .btn{width:auto;flex:1;min-width:150px}

  .topbar{display:flex;align-items:center;justify-content:space-between;font-family:"Space Mono",monospace;
    font-size:12px;color:var(--muted);margin-bottom:10px}
  .topbar b{color:var(--ink)}
  .meter{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:24px}
  .meter > i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .35s ease}
  .qtag{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--blue);margin-bottom:10px}
  .qtext{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:18px;line-height:1.6;margin:0 0 20px}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;background:var(--paper-2);
    border:1px solid var(--line);border-radius:11px;padding:14px 15px;cursor:pointer;font-size:15px;
    color:var(--ink);font-family:"Noto Sans JP",sans-serif;transition:border-color .12s, background .12s;line-height:1.55}
  .choice:hover:not(:disabled){border-color:var(--ink)}
  .choice:disabled{cursor:default}
  .choice .key{font-family:"Space Mono",monospace;font-weight:700;font-size:13px;color:var(--blue);
    flex:none;width:18px;text-align:center;margin-top:1px}
  .choice.correct{background:var(--green-bg);border-color:var(--green)}
  .choice.correct .key{color:var(--green)}
  .choice.wrong{background:var(--red-bg);border-color:var(--red)}
  .choice.wrong .key{color:var(--red)}
  .choice .mark{margin-left:auto;font-weight:700;font-family:"Space Mono",monospace;flex:none}
  .choice.correct .mark{color:var(--green)}
  .choice.wrong .mark{color:var(--red)}
  .choice:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .explain{margin-top:18px;border-left:3px solid var(--blue);background:rgba(46,90,168,.05);
    border-radius:0 10px 10px 0;padding:13px 16px;font-size:14px;color:var(--ink-soft);
    opacity:0;transform:translateY(4px);transition:opacity .25s, transform .25s}
  .explain.show{opacity:1;transform:none}
  .explain .h{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--blue);margin-bottom:5px;display:block}
  .explain.bad{border-left-color:var(--red);background:var(--red-bg)}
  .explain.bad .h{color:var(--red)}
  .quiz-foot{margin-top:24px}

  .ring-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 8px}
  .ring{position:relative;width:180px;height:180px}
  .ring svg{transform:rotate(-90deg)}
  .ring .read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct{font-family:"Space Mono",monospace;font-weight:700;font-size:42px;color:var(--ink);line-height:1}
  .ring .pct span{font-size:18px}
  .ring .frac{font-family:"Space Mono",monospace;font-size:12px;color:var(--muted);margin-top:6px}
  .verdict{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:18px;margin:16px 0 4px}
  .verdict + p{color:var(--muted);font-size:13px;margin:0}

  .brow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:none}
  .brow .name{font-size:14px;font-weight:500}
  .brow .score{font-family:"Space Mono",monospace;font-size:13px;color:var(--ink-soft)}
  .bbar{grid-column:1 / -1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
  .bbar > i{display:block;height:100%;border-radius:999px;background:var(--green)}
  .bbar > i.low{background:var(--red)} .bbar > i.mid{background:var(--blue)}

  .review .ritem{border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px;background:var(--paper-2)}
  .review .rq{font-weight:500;font-size:14px;margin:0 0 9px;line-height:1.55}
  .review .rq .n{font-family:"Space Mono",monospace;color:var(--red);margin-right:7px}
  .review .ra{font-size:13px;margin:3px 0}
  .review .ra .lab{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:6px}
  .review .ra.you{color:var(--red)} .review .ra.ok{color:var(--green)}
  .review .rx{font-size:13px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

  .gap{height:26px}
  .hidden{display:none !important}
  .center-note{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
  @media (max-width:480px){.wrap{padding:18px 14px 56px}.card{padding:18px}.qtext{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <p class="eyebrow">Psychological Tests · Memory Drill</p>
    <h1>心理検査<br>暗記ドリル</h1>
    <p class="sub">表3-1〜表7-2の検査をまるごと。全103問・8カテゴリ。1回20問から回せます。</p>
  </header>

  <!-- HOME -->
  <section id="home" class="card">
    <p class="lead">覚えたいカテゴリを選んで、1回の出題数を決めてスタート。発行年や所要時間より「何を測るか・適用年齢・その検査の特徴・カットオフ値」を厚めにしています。間違えた問題だけの復習もできます。</p>

    <p class="seclabel">出題カテゴリ
      <span class="mini"><button id="selAll" type="button">全部選ぶ</button><button id="selNone" type="button">解除</button></span>
    </p>
    <div class="chips" id="chips"></div>

    <p class="seclabel">1回の出題数</p>
    <div class="seg" id="limitSeg" style="margin-bottom:22px">
      <button type="button" data-lim="20">20問</button>
      <button type="button" data-lim="40" aria-pressed="true">40問</button>
      <button type="button" data-lim="0">すべて</button>
    </div>

    <p class="seclabel">設定</p>
    <div class="opts-row">
      <label class="toggle"><input type="checkbox" id="shuffleToggle" checked><span class="switch"></span>問題をシャッフル</label>
      <label class="toggle"><input type="checkbox" id="shuffleChoices" checked><span class="switch"></span>選択肢もシャッフル</label>
    </div>

    <button class="btn btn-primary" id="startBtn">スタート <span class="ar" id="startCount"></span></button>
    <p class="center-note">短いセットを毎日まわすのが、いちばん定着します。</p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar"><span><b id="qNow">1</b> / <span id="qTotal">40</span></span><span id="qRight">正解 0</span></div>
    <div class="meter"><i id="meterFill" style="width:0%"></i></div>
    <div class="card">
      <div class="qtag"><span id="qCat">カテゴリ</span> · 4択</div>
      <h2 class="qtext" id="qText">…</h2>
      <div class="choices" id="qChoices"></div>
      <div class="explain" id="qExplain"><span class="h" id="qExplainH">解説</span><span id="qExplainBody"></span></div>
    </div>
    <div class="quiz-foot"><button class="btn btn-primary hidden" id="nextBtn">次の問題 <span class="ar">→</span></button></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="ring-wrap">
        <div class="ring">
          <svg width="180" height="180" viewBox="0 0 180 180">
            <circle cx="90" cy="90" r="78" fill="none" stroke="var(--line)" stroke-width="14"></circle>
            <circle id="ringFg" cx="90" cy="90" r="78" fill="none" stroke="var(--green)" stroke-width="14"
              stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="490"></circle>
          </svg>
          <div class="read"><div class="pct" id="resPct">0<span>%</span></div><div class="frac" id="resFrac">0 / 0</div></div>
        </div>
        <div class="verdict" id="resVerdict">おつかれさま</div>
        <p id="resBlurb"></p>
      </div>
    </div>
    <div class="gap"></div>
    <p class="seclabel">カテゴリ別の出来</p>
    <div class="card" id="breakdown"></div>
    <div class="gap"></div>
    <div id="reviewWrap"><p class="seclabel">間違えた問題の復習</p><div class="review" id="review"></div></div>
    <div class="gap"></div>
    <div class="btnrow">
      <button class="btn btn-primary" id="retryBtn">もう一度（同じ条件）</button>
      <button class="btn btn-ghost" id="wrongBtn">間違いだけ復習</button>
    </div>
    <div style="height:10px"></div>
    <button class="btn btn-ghost" id="homeBtn">設定を選び直す</button>
  </section>
</div>

<script>
const CAT = {
  dev:"発達検査", iq:"知能検査", screen:"認知症・全般機能",
  frontal:"前頭葉・遂行機能", visual:"注意・視空間・失語", memory:"記憶機能",
  asd:"ASD関連", adhdld:"ADHD・LD関連"
};
const CAT_ORDER = ["dev","iq","screen","frontal","visual","memory","asd","adhdld"];

// すべて4択。o[0] が正解（表示時にシャッフルされる）
const QUESTIONS = [
 // ---- 発達検査 ----
 {c:"dev",q:"養育者への質問で「運動」「探索」「社会」「生活習慣」「言語」の5領域の発達年齢を測る検査は？",o:["乳幼児精神発達診断法","遠城寺式乳幼児分析的発達検査","DENVER II","新版K式発達検査2020"],e:"養育者への質問紙形式（間接検査法）。5領域の発達年齢とプロフィールが得られる。"},
 {c:"dev",q:"0歳〜4歳7カ月が適用で、運動・社会性・言語の3分野を分析的にとらえ、発達グラフから発達障害の部位を把握できる検査は？",o:["遠城寺式乳幼児分析的発達検査","乳幼児精神発達診断法","KIDS乳幼児発達スケール","Bayley-III"],e:"6領域のプロフィールを発達グラフ化できるのが特徴。"},
 {c:"dev",q:"約130項目を◯×で養育者などが回答し、簡単に発達年齢を求められる9領域の発達検査は？",o:["KIDS乳幼児発達スケール","遠城寺式乳幼児分析的発達検査","DENVER II","新版K式発達検査2020"],e:"◯の数を集計して発達年齢を算出する。"},
 {c:"dev",q:"KIDS乳幼児発達スケールで「発達遅滞傾向児向き」とされるタイプは？",o:["タイプT","タイプA","タイプB","タイプC"],e:"A/B/Cは年齢帯で分かれ、Tは発達遅滞傾向児向き。"},
 {c:"dev",q:"「姿勢・運動(P-M)」「認知・適応(C-A)」「言語・社会(L-S)」の3領域で発達年齢(DA)・発達指数(DQ)を出す検査は？",o:["新版K式発達検査2020","遠城寺式乳幼児分析的発達検査","KIDS乳幼児発達スケール","DENVER II"],e:"ビネーやゲゼルの発達理論をもとに作成された。"},
 {c:"dev",q:"新版K式発達検査2020の実施順について正しいのは？",o:["実施順は決まっていない","必ず低年齢の課題から始める","領域ごとに順番が固定されている","必ず言語課題から始める"],e:"実施順は固定されていない。"},
 {c:"dev",q:"子どもに直接実施する尺度と保護者の質問紙の両方をもち、計5尺度で成長チャートも作れる発達検査は？",o:["Bayley-III","乳幼児精神発達診断法","遠城寺式乳幼児分析的発達検査","DENVER II"],e:"認知・言語・運動（直接）＋社会-情動・適応行動（質問紙）の計5尺度。"},
 {c:"dev",q:"Bayley-IIIで保護者が質問紙に回答する尺度はどれ？",o:["社会-情動尺度・適応行動尺度","認知尺度・言語尺度","運動尺度・認知尺度","言語尺度・運動尺度"],e:"認知・言語・運動は子どもに直接実施、社会-情動と適応行動は保護者質問紙。"},
 {c:"dev",q:"「個人-社会」「微細運動-適応」「言語」「粗大運動」の4領域を、約15分・1次スクリーニングとして評価する発達判定法は？",o:["DENVER II","新版K式発達検査2020","KIDS乳幼児発達スケール","Bayley-III"],e:"各観察項目の不合格数で判定する。"},
 {c:"dev",q:"DENVER IIの判定区分として正しいのは？",o:["正常／疑い／判定不能","軽度／中等度／重度","合格／不合格","陽性／陰性"],e:"不合格項目の数で3区分に判定する。"},
 {c:"dev",q:"適用年齢が「0歳〜成人」と最も広い発達検査は？",o:["新版K式発達検査2020","遠城寺式乳幼児分析的発達検査","DENVER II","KIDS乳幼児発達スケール"],e:"0歳から成人まで適用できる。"},
 {c:"dev",q:"KIDS乳幼児発達スケールのタイプCの適用年齢は？",o:["3歳0カ月〜6歳11カ月","0歳1カ月〜0歳11カ月","1歳0カ月〜2歳11カ月","0〜6歳"],e:"A=0歳台、B=1〜2歳台、C=3〜6歳台、T=遅滞傾向児向き。"},
 {c:"dev",q:"乳幼児精神発達診断法の実施方法として正しいのは？",o:["日常生活行動を観察している養育者に質問する","子どもに直接課題を行わせる","行動観察のみで評定する","半構造化面接を行う"],e:"養育者への質問による間接検査法。"},
 {c:"dev",q:"遠城寺式乳幼児分析的発達検査の所要時間の目安は？",o:["10〜15分","30分","50〜90分","約2時間"],e:"短時間で実施できる。"},

 // ---- 知能検査 ----
 {c:"iq",q:"田中ビネー知能検査Vで、2歳〜13歳11カ月の段階で算出される指標は？",o:["精神年齢(MA)と偏差知能指数(DIQ)","偏差知能指数(DIQ)のみ","発達指数(DQ)","全検査IQ(FSIQ)"],e:"14歳以上はMAを出さず4分野でDIQを算出する。"},
 {c:"iq",q:"田中ビネーVで14歳以上に用いる4分野はどれ？",o:["結晶性／流動性／記憶／論理推理","言語／知覚／記憶／処理速度","継次／同時／計画／学習","運動／言語／社会／適応"],e:"14歳以上はこの4分野でDIQを算出する。"},
 {c:"iq",q:"ウェクスラー式知能検査のうち「幼児用」にあたるのは？",o:["WPPSI-III","WISC-V","WAIS-IV","田中ビネーV"],e:"WPPSI=幼児用、WISC=児童用、WAIS=成人用。"},

// ---------- state ----------
let selectedCats = new Set();
let qLimit = 40;              // 0 = すべて
let session = [], idx = 0, correctCount = 0;
const $ = id => document.getElementById(id);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function buildChips(){
  const counts={}; QUESTIONS.forEach(q=>counts[q.c]=(counts[q.c]||0)+1);
  const wrap=$("chips"); wrap.innerHTML="";
  CAT_ORDER.forEach(k=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","false"); b.dataset.cat=k;
    b.innerHTML=`${CAT[k]} <span class="ct">${counts[k]||0}</span>`;
    b.addEventListener("click",()=>{
      if(selectedCats.has(k)){selectedCats.delete(k);b.setAttribute("aria-pressed","false");}
      else{selectedCats.add(k);b.setAttribute("aria-pressed","true");}
      updateStartCount();
    });
    wrap.appendChild(b);
  });
  updateStartCount();
}
function setAllChips(on){
  selectedCats = on ? new Set(CAT_ORDER) : new Set();
  [...$("chips").children].forEach(b=>b.setAttribute("aria-pressed", on?"true":"false"));
  updateStartCount();
}
function pool(){ return selectedCats.size? QUESTIONS.filter(q=>selectedCats.has(q.c)) : QUESTIONS.slice(); }
function plannedCount(){ const n=pool().length; return qLimit>0? Math.min(qLimit,n) : n; }
function updateStartCount(){ const n=plannedCount(); $("startCount").textContent=`→ ${n}問`; $("startBtn").disabled=n===0; }

$("limitSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  qLimit=parseInt(b.dataset.lim,10);
  [...$("limitSeg").children].forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); updateStartCount();
});
$("selAll").addEventListener("click",()=>setAllChips(true));
$("selNone").addEventListener("click",()=>setAllChips(false));

function startSession(list){
  let qs = $("shuffleToggle").checked ? shuffle(list) : list.slice();
  if(qLimit>0) qs = qs.slice(0,qLimit);
  const shufC=$("shuffleChoices").checked;
  session = qs.map(q=>{
    let order=q.o.map((_,i)=>i);
    if(shufC) order=shuffle(order);
    return {q, order, picked:null, correctIdx:order.indexOf(0)};
  });
  idx=0; correctCount=0;
  $("home").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
  $("qTotal").textContent=session.length;
  renderQ(); window.scrollTo({top:0});
}
function renderQ(){
  const s=session[idx];
  $("qNow").textContent=idx+1;
  $("qRight").textContent=`正解 ${correctCount}`;
  $("meterFill").style.width=`${(idx/session.length)*100}%`;
  $("qCat").textContent=CAT[s.q.c];
  $("qText").textContent=s.q.q;
  const box=$("qChoices"); box.innerHTML="";
  const keys=["A","B","C","D"];
  s.order.forEach((origIdx,pos)=>{
    const btn=document.createElement("button"); btn.className="choice"; btn.type="button";
    btn.innerHTML=`<span class="key">${keys[pos]||""}</span><span>${s.q.o[origIdx]}</span>`;
    btn.addEventListener("click",()=>answer(pos,btn));
    box.appendChild(btn);
  });
  const ex=$("qExplain"); ex.classList.remove("show","bad");
  $("nextBtn").classList.add("hidden");
}
function answer(pos){
  const s=session[idx]; if(s.picked!==null) return;
  s.picked=pos;
  const buttons=[...$("qChoices").children];
  const right=pos===s.correctIdx; if(right) correctCount++;
  buttons.forEach((b,i)=>{
    b.disabled=true;
    if(i===s.correctIdx){b.classList.add("correct");b.insertAdjacentHTML("beforeend",'<span class="mark">正解</span>');}
    else if(i===pos){b.classList.add("wrong");b.insertAdjacentHTML("beforeend",'<span class="mark">×</span>');}
  });
  const ex=$("qExplain");
  $("qExplainH").textContent=right?"正解 — 解説":"おしい — 解説";
  $("qExplainBody").textContent=" "+s.q.e;
  ex.classList.toggle("bad",!right); ex.classList.add("show");
  $("qRight").textContent=`正解 ${correctCount}`;
  const nb=$("nextBtn"); nb.classList.remove("hidden");
  nb.querySelector(".ar").textContent=(idx===session.length-1)?"":"→";
  nb.childNodes[0].nodeValue=(idx===session.length-1)?"結果を見る ":"次の問題 ";
  nb.focus();
}
$("nextBtn").addEventListener("click",()=>{
  if(idx===session.length-1){showResult();}
  else{idx++;renderQ();window.scrollTo({top:0,behavior:"smooth"});}
});
function showResult(){
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  const total=session.length, pct=Math.round((correctCount/total)*100);
  $("resPct").innerHTML=`${pct}<span>%</span>`; $("resFrac").textContent=`${correctCount} / ${total}`;
  const C=2*Math.PI*78, fg=$("ringFg");
  fg.style.strokeDasharray=C; fg.style.strokeDashoffset=C;
  fg.setAttribute("stroke", pct>=80?"var(--green)":pct>=50?"var(--blue)":"var(--red)");
  requestAnimationFrame(()=>{fg.style.transition="stroke-dashoffset .9s ease";fg.style.strokeDashoffset=C*(1-pct/100);});
  let v,b;
  if(pct>=90){v="ほぼ完璧";b="この調子。間違えた検査だけ最終チェックすれば仕上がりです。";}
  else if(pct>=70){v="いい線いってる";b="大枠は入っています。取りこぼした検査を復習で詰めましょう。";}
  else if(pct>=50){v="あと一歩";b="半分は取れています。弱いカテゴリだけ繰り返すと一気に伸びます。";}
  else{v="ここからが伸びどき";b="まずは間違えた問題の解説を通読。カテゴリを1つに絞って20問ずつが効きます。";}
  $("resVerdict").textContent=v; $("resBlurb").textContent=b;
  const stat={};
  session.forEach(s=>{const k=s.q.c;stat[k]=stat[k]||{n:0,ok:0};stat[k].n++;if(s.picked===s.correctIdx)stat[k].ok++;});
  const bd=$("breakdown"); bd.innerHTML="";
  CAT_ORDER.filter(k=>stat[k]).forEach(k=>{
    const {n,ok}=stat[k], p=Math.round((ok/n)*100), cls=p>=80?"":p>=50?"mid":"low";
    const row=document.createElement("div"); row.className="brow";
    row.innerHTML=`<span class="name">${CAT[k]}</span><span class="score">${ok}/${n} · ${p}%</span><span class="bbar"><i class="${cls}" style="width:${p}%"></i></span>`;
    bd.appendChild(row);
  });
  const wrong=session.filter(s=>s.picked!==s.correctIdx);
  const rWrap=$("reviewWrap"), rv=$("review");
  if(wrong.length===0){
    rWrap.innerHTML='<p class="seclabel">復習</p><div class="card" style="text-align:center;color:var(--green);font-weight:700">全問正解！復習はなしです 🎯</div>';
  }else{
    rv.innerHTML="";
    wrong.forEach(s=>{
      const yourText=s.picked!==null?s.q.o[s.order[s.picked]]:"（無回答）";
      const it=document.createElement("div"); it.className="ritem";
      it.innerHTML=`<p class="rq"><span class="n">Q</span>${s.q.q}</p>
        <p class="ra you"><span class="lab">あなた</span>${yourText}</p>
        <p class="ra ok"><span class="lab">正解</span>${s.q.o[0]}</p>
        <p class="rx">${s.q.e}</p>`;
      rv.appendChild(it);
    });
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
$("startBtn").addEventListener("click",()=>startSession(pool()));
$("retryBtn").addEventListener("click",()=>startSession(pool()));
$("wrongBtn").addEventListener("click",()=>{
  const w=session.filter(s=>s.picked!==s.correctIdx).map(s=>s.q);
  startSession(w.length?w:pool());
});
$("homeBtn").addEventListener("click",()=>{
  $("result").classList.add("hidden"); $("quiz").classList.add("hidden"); $("home").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
});
buildChips();
</script>
</body>
</html>
